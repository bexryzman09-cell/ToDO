<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Lab Todo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="shortcut icon" href="/images/logo-web.png" type="image/x-icon">
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="box-header">
                <a class="header-logo" href=""><img width="121.97" height="34" src="images/logo.png" alt="logo"></a>
                <a class="header-man" href=""><img width="30" height="30" src="images/man.png" alt="man"></a>
            </div>
        </div>
    </header>
    <main>
        <section>
            <div class="container">
                <h1 class="title">Hello, Aqeel , <span>Start planning today</span></h1>
                <div class="box-main">

                    <div class="box-left">
                        <p class="day-name" id="dayName">Sunday</p>
                        <h2 class="date" id="dateText">04, April 2024</h2>

                        <div class="calendar">
                            <div class="calendar-top">
                                <button class="calendar-btn" id="prevBtn">&lt;</button>
                                <p class="calendar-month" id="monthText">April</p>
                                <button class="calendar-btn" id="nextBtn">&gt;</button>
                            </div>
                            <div class="calendar-grid calendar-names">
                                <span></span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span
                                    class="weekend">Sa</span><span class="weekend">Su</span>
                            </div>
                            <div class="calendar-grid" id="calendarDays"></div>
                        </div>
                    </div>

                    <div class="box-right">
                        <form class="form" id="taskForm">
                            <input class="form-input" id="taskTitle" type="text" placeholder="Type Title of task">
                            <input class="form-input" id="taskText" type="text" placeholder="Detail of your task">
                            <button class="form-btn" type="submit">+</button>
                        </form>

                        <div class="box-filter">
                            <select class="select" id="statusSelect">
                                <option value="all">By category</option>
                                <option value="done">Done</option>п
                                <option value="pending">Pending</option>
                            </select>
                            <select class="select" id="sortSelect">
                                <option value="new">By priority</option>
                                <option value="old">Oldest first</option>
                            </select>
                            <input class="search" id="searchInput" type="search" placeholder="Search by name">
                        </div>

                        <div class="box-tasks" id="taskList"></div>
                        <button class="load-btn" id="loadBtn">Load more</button>

                    </div>

                    <div class="box-bottom">
                        <div class="box-count">
                            <div class="count-done">
                                <h3>COMPLETED <br> TASKS</h3>
                                <p id="doneCount">00</p>
                            </div>
                            <div class="count-pending">
                                <h3>PENDING <br> TASKS</h3>
                                <p id="pendingCount">00</p>
                            </div>
                        </div>
                        <div class="box-info">
                            <div class="info-left">
                                <h2>Tasks created</h2>
                                <p id="createdCount">0</p>
                            </div>
                            <div class="info-right">
                                <p><span>25k+</span> Active Users</p>
                                <img width="68.77" height="20.23" src="images/avatars.png" alt="avatars">
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>
    <footer>

            <div class="box-footer">
                <a class="footer-logo" href=""><img width="131" height="20" src="images/logo.png" alt="logo"></a>
                <p class="footer-text">© 2024 Aqeel Shahzad. All Rights Reserved. </p>

        </div>
    </footer>
    <script src="app.js"></script>
</body>
